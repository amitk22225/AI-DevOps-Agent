name: DevOps Agent infrastructure (dev)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['infrastructure/terraform/dev/devops_agent.tf']

permissions:
  id-token: write
  contents: read

jobs:
  devops-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948451199137:role/my-agents1234-dev-deploy
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
        working-directory: infrastructure/terraform/dev
      - run: terraform apply -auto-approve -target=awscc_devopsagent_agent_space.main
        working-directory: infrastructure/terraform/dev
